
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empresas Cadastradas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Empresas</h2>
    <a href="/nova" class="btn btn-success mb-3">Cadastrar Nova</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>CNPJ</th>
                <th>Razão Social</th>
                <th>Nome Fantasia</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="empresa : ${empresas}">
                <td th:text="${empresa.cnpj}"></td>
                <td th:text="${empresa.razaoSocial}"></td>
                <td th:text="${empresa.nomeFantasia}"></td>
                <td th:text="${empresa.email}"></td>
                <td>
                    <a th:href="@{'/editar/' + ${empresa.cnpj}}" class="btn btn-sm btn-primary">Editar</a>
                    <a th:href="@{'/excluir/' + ${empresa.cnpj}}" class="btn btn-sm btn-danger">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
