
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2 th:text="${empresa.cnpj} == null ? 'Nova Empresa' : 'Editar Empresa'"></h2>
    <form th:action="@{/salvar}" th:object="${empresa}" method="post">
        <div class="mb-3">
            <label class="form-label">CNPJ</label>
            <input type="text" class="form-control" th:field="*{cnpj}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Razão Social</label>
            <input type="text" class="form-control" th:field="*{razaoSocial}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nome Fantasia</label>
            <input type="text" class="form-control" th:field="*{nomeFantasia}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Endereço</label>
            <input type="text" class="form-control" th:field="*{endereco}">
        </div>
        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control" th:field="*{telefone}">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}">
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
